name: Estado LAZARUS OPS

on:
  # DESACTIVADO el 2026-08-05. El cron de GitHub daba una ejecucion cada
  # 1-2 horas en vez de cada 5 minutos, porque GitHub deprioriza los
  # workflows programados. El bot pasa a ejecutarse en el PC del usuario
  # (ver bot_local.py). Se deja solo el disparo manual como respaldo:
  # sirve para refrescar el mensaje si el PC esta apagado.
  #
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # Si una ejecucion se retrasa, la nueva la sustituye en vez de encolarse.
  group: estado-lazarus
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar el mensaje de Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MESSAGE_ID: ${{ secrets.DISCORD_MESSAGE_ID }}
          # El logo se sirve desde este mismo repo, sin configurar nada.
          LAZARUS_LOGO_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/logo_lazarus.png
        run: python update.py
